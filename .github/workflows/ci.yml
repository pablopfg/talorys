name: CI

# Runs once per pull request commit. There is no push trigger: main and develop
# only change through pull requests (see docs/branch-protection.md), so a push
# run after the merge would repeat the tests on code the pull request already
# tested.
on:
  pull_request:
  # Lets a missing run be started by hand from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# A new commit on the same pull request cancels the run that is still going.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:pack
      # Skips itself when the secrets are not configured.
      - name: Real-account smoke test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run test:smoke

  unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The agent suite is the slowest, so it is split across three runners.
          - name: agent 1/3
            run: npm test -w @talorys/agent -- --shard=1/3
          - name: agent 2/3
            run: npm test -w @talorys/agent -- --shard=2/3
          - name: agent 3/3
            run: npm test -w @talorys/agent -- --shard=3/3
          - name: shared, web, installer
            run: npm run test:shared && npm test -w @talorys/web && npm test -w create-talorys
    name: unit (${{ matrix.name }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: ${{ matrix.run }}

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # The single check the branch rules require. It passes only when every job
  # above passed, so the rules don't have to list each job.
  test:
    if: ${{ !cancelled() }}
    needs: [checks, unit, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            [ "$r" = "success" ] || { echo "::error::A CI job did not pass ($r)."; exit 1; }
          done
