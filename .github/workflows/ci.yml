name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:
    inputs:
      smoke:
        description: Run the real-account smoke test (deploys to the CI Cloudflare account)
        type: boolean
        default: false

# The token only needs to read the repository. Jobs ask for more explicitly.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run test:pack
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  # Deploys a real installation with long-lived Cloudflare credentials, so it never runs
  # on pull requests or plain pushes: only on demand, behind the "smoke" environment
  # (add required reviewers to it in Settings → Environments).
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: smoke
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Skips itself when the secrets are not configured.
      - name: Real-account smoke test
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run test:smoke
