name: Branch policy

on:
  pull_request:
    branches: [main]

# Reads nothing from the repository: the check uses only the event's branch names.
permissions: {}

jobs:
  # main only receives develop (releases) or hotfix/* branches.
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO: ${{ github.repository }}
        run: |
          # A fork can name a branch "develop" too: only this repository's branches count.
          if [ "$HEAD_REPO" != "$BASE_REPO" ]; then
            echo "::error::Pull requests into main must come from a branch of this repository, not from a fork."
            exit 1
          fi
          case "$HEAD_REF" in
            develop|hotfix/*) echo "OK: $HEAD_REF -> main" ;;
            *)
              echo "::error::Pull requests into main must come from develop or hotfix/*, not '$HEAD_REF'."
              exit 1
              ;;
          esac
