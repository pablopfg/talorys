name: Release

# Publishes a GitHub release when main reaches a version that has no tag yet.
# The version comes from packages/create-talorys/package.json and the notes
# from its CHANGELOG.md section, both set by prepare-release.yml.
# The installer of that tag is then published, private, to GitHub Packages as
# @<owner>/create-talorys (docs/releases.md#instalador-no-github-packages).
# Running it by hand publishes the current version if it isn't there yet.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the tag and the release
    outputs:
      version: ${{ steps.version.outputs.version }}
      new: ${{ steps.version.outputs.new }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          # Never cache in a job that holds a write token (cache entries are shared state).
          package-manager-cache: false
      - name: Find the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node scripts/release.mjs current)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "v$version is already released."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create the release
        if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          node scripts/release.mjs notes "$VERSION" > "$RUNNER_TEMP/notes.md"
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; *) flags+=(--latest) ;; esac
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/notes.md" "${flags[@]}"
          echo "### Released [v$VERSION](https://github.com/${GITHUB_REPOSITORY}/releases/tag/v$VERSION)" >> "$GITHUB_STEP_SUMMARY"

  # Built and checked without any write token, then published by a job that runs no project code.
  package-build:
    needs: release
    if: needs.release.outputs.new == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      # The release's tag, not whatever main has now.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v${{ needs.release.outputs.version }}
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main
        run: |
          git fetch --quiet --no-tags origin main
          git merge-base --is-ancestor HEAD FETCH_HEAD || { echo "::error::v$VERSION is not on main."; exit 1; }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      # Builds the installer and checks the tarball installs and runs, as CI does.
      - run: npm run test:pack
      - name: Rename for GitHub Packages and check the renamed tarball
        run: |
          set -euo pipefail
          name="$(node scripts/release.mjs github-package "$GITHUB_REPOSITORY")"
          mkdir -p "$RUNNER_TEMP/out" "$RUNNER_TEMP/try"
          npm pack ./packages/create-talorys --ignore-scripts --pack-destination "$RUNNER_TEMP/out"
          tgz="$(ls "$RUNNER_TEMP"/out/*.tgz)"
          cd "$RUNNER_TEMP/try"
          echo '{"name":"try","private":true}' > package.json
          npm install --no-audit --no-fund --ignore-scripts "$tgz"
          cli="node_modules/$name/dist/cli.js"
          node "$cli" --help | grep -qF "npx $name@latest"
          [ "$(node "$cli" --version)" = "$VERSION" ]
          if grep -rlE 'npx create-talorys[@ ]' "node_modules/$name/dist" "node_modules/$name/templates"; then
            echo "::error::Commands above still point at the original's create-talorys."
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installer
          path: ${{ runner.temp }}/out/*.tgz
          if-no-files-found: error
          retention-days: 1

  package:
    needs: [release, package-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected environment: in Settings → Environments → packages, allow only the main branch.
    environment: packages
    permissions:
      packages: write # publish to GitHub Packages, with this run's token only
    env:
      VERSION: ${{ needs.release.outputs.version }}
      # npm reads the token from the environment; it is never written to disk.
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: installer
          path: ${{ runner.temp }}/out
      - name: Publish
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          name="@$owner/create-talorys"
          rc="$RUNNER_TEMP/packages.npmrc"
          printf '@%s:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' "$owner" > "$rc"
          if npm view "$name@$VERSION" version --userconfig "$rc" >/dev/null 2>&1; then
            echo "$name@$VERSION is already on GitHub Packages."
            exit 0
          fi
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          npm publish "$(ls "$RUNNER_TEMP"/out/*.tgz)" --tag "$tag" --ignore-scripts --userconfig "$rc"
          echo "### Published $name@$VERSION to GitHub Packages" >> "$GITHUB_STEP_SUMMARY"
